version: "3.8"

services:
  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "5001:5001"
    networks:
      - microservices-net

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "5002:5002"
    networks:
      - microservices-net

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "5003:5003"
    networks:
      - microservices-net

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "5000:5000"
    environment:
      # These use the docker-compose service names as hostnames -
      # Docker's internal DNS resolves them automatically.
      - USER_SERVICE_URL=http://user-service:5001
      - PAYMENT_SERVICE_URL=http://payment-service:5002
      - NOTIFICATION_SERVICE_URL=http://notification-service:5003
    depends_on:
      - user-service
      - payment-service
      - notification-service
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge
